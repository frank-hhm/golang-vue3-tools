# go-tools 生成的 nginx.conf（改端口/站点根请编辑本文件后「重启」实例）
worker_processes  1;
error_log  "E:/go-tools-bak/bin/data/nginx-instances/inst-1792752505660793600/logs/error.log";
pid        "E:/go-tools-bak/bin/data/nginx-instances/inst-1792752505660793600/logs/nginx.pid";
events {
    worker_connections  1024;
}
http {
    access_log      "E:/go-tools-bak/bin/data/nginx-instances/inst-1792752505660793600/logs/access.log";
    include       "E:/go-tools-bak/bin/plugins/nginx/1.25.5/conf/mime.types";
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server {
        listen       8091;
        server_name  localhost;
        root         "E:/go-tools-bak/bin/data/www/测试";
        index  index.html index.php index.htm;
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        "E:/go-tools-bak/bin/plugins/nginx/1.25.5/conf/fastcgi_params";
        }
        location = /stub_status {
            stub_status;
            access_log off;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   "E:/go-tools-bak/bin/data/nginx-instances/inst-1792752505660793600/html";
        }
    }
}
